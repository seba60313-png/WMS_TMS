man(){const s=[['Navegar','Usa el menú lateral para abrir cada módulo. En el celular, toca ☰ para abrirlo.'],['Buscar','El buscador del encabezado filtra las filas de la vista abierta.'],['Notificaciones','La campana 🔔 resume stock bajo, lotes por vencer o vencidos y despachos atrasados.'],['Crear una solicitud','En Solicitudes, completa el formulario y pulsa “Crear solicitud”. Queda como Pendiente.'],['Datos de demostración','Todos los datos son ficticios y se guardan en este navegador. Puedes restablecerlos desde el Dashboard.'],['Registrar un producto','En Inventario abre “Nuevo producto”, completa los datos y pulsa “Guardar producto”. El SKU y el código de barras no pueden repetirse.'],['Registrar un movimiento','En Inventario elige el producto, el tipo (Ingreso, Retiro o Ajuste), la cantidad y el motivo. En Ajuste, la cantidad es el stock contado. Cada movimiento queda en el historial con fecha, hora y usuario.'],['Stock disponible','Disponible = stock − reservado − comprometido. Reservado son las solicitudes aprobadas sin entregar; comprometido, las solicitudes pendientes de aprobación.'],['Ingresar un lote','En Inventario elige Ingreso y completa lote, vencimiento y ubicación. Si el lote ya existe con el mismo vencimiento, se suma su cantidad.'],['Salida con FEFO','En FEFO y lotes indica producto, cantidad y motivo, pulsa “Sugerir lotes FEFO”, reparte entre lotes si lo necesitas y confirma. Los lotes vencidos, retenidos o sin saldo no se pueden usar.'],['Configurar la clasificación ABC','En Clasificación ABC cambia los porcentajes acumulados de las clases A y B y pulsa “Aplicar”.'],['Solicitar materias primas','En Solicitudes completa departamento, responsable, orden de trabajo, producto, cantidad, prioridad y fecha. La solicitud queda Pendiente.'],['Aprobar y entregar','Con perfil Administrador: abre la solicitud, define la cantidad autorizada y aprueba (no descuenta stock; solo reserva). Con perfil Bodeguero: inicia la preparación y registra cada entrega eligiendo lotes con FEFO. Las entregas parciales dejan saldo pendiente.'],['Perfiles de demostración','El selector del encabezado cambia el perfil. Solicitante crea y anula pendientes; Bodeguero prepara y entrega; Administrador aprueba, rechaza y anula.'],['Mapa de bodega','En Bodega cada sector muestra sus racks y niveles. Cada casilla indica pallets ocupados y capacidad: verde libre, azul con stock, rojo llena, rayada con candado bloqueada. Toca una casilla para ver sus lotes.'],['Registrar un traslado','En Bodega elige el lote, la cantidad, el destino y el motivo. El sistema rechaza destinos bloqueados, sin capacidad o incompatibles: los lotes retenidos o vencidos solo van a Retenidos, y los demás no.'],['Configurar el plano','Con perfil Administrador, en Bodega crea un sector o cambia sus pasillos, racks, niveles y capacidad. No se puede reducir un sector si dejaría lotes fuera del plano o sobre la capacidad.'],['Planificar un despacho','En TMS crea una orden: destino, paradas separadas por punto y coma, fecha, vehículo, kilómetros y las solicitudes con entregas de bodega que viajan. El sistema valida la capacidad del vehículo y que no se despache dos veces la misma entrega.'],['Seguir una orden','Abre la orden y avanza: Iniciar carga, Despachar y Confirmar entrega con el comprobante (quién recibe y N° de guía). Puedes registrar incidencias o cancelar con motivo. Todo queda en el historial.'],['Ver el mapa','En GPS se muestra un mapa de OpenStreetMap con tus ubicaciones registradas, los recorridos de las órdenes activas y la posición de cada vehículo. Necesita conexión a internet.'],['Registrar ubicaciones','El mapa solo dibuja lugares con coordenadas. En GPS, registra el nombre exacto del origen, las paradas o el destino de la orden con su latitud y longitud (puedes tocar el mapa para llenarlas). Mientras falten, la orden aparece en el aviso de órdenes sin coordenadas.'],['Qué es simulado','No hay un GPS real conectado. Las posiciones de los vehículos, el avance, la hora de actualización y la hora estimada de llegada son simulados y se marcan como tales. Con Avanzar simulación el vehículo en ruta se adelanta un 10 %. La línea del recorrido es recta, no sigue calles.'],['Sugerir orden de paradas','En GPS elige una orden planificada con 2 o más paradas y pulsa Sugerir. Es una aproximación en línea recta (vecino más cercano). Si te sirve, aplícala y queda en el historial de la orden.'],['Exportar a Excel','En Reportes pulsa Exportar todo a Excel. Se descarga un libro .xlsx con una hoja por módulo: productos, lotes, movimientos, solicitudes, órdenes, flota y ubicaciones GPS. Úsalo también como respaldo.'],['Importar productos desde Excel','En Reportes descarga la plantilla, llena la hoja Productos (SKU, código de barras, descripción, categoría, unidad, costo, proveedor, stock mínimo y máximo; pallet y peso son opcionales) y súbela. Cada fila válida crea un producto con stock 0. Las filas con errores se rechazan y el mensaje indica fila y motivo. Luego importa los ingresos con otra plantilla (SKU, cantidad, lote, vencimiento, ubicación y motivo). Cada fila válida suma stock al lote con las mismas reglas del ingreso manual: el lote no puede estar vencido y la ubicación debe tener capacidad y no estar bloqueada. Cada ingreso queda en el historial de movimientos.'],['Autopruebas','En Reportes pulsa Ejecutar pruebas para verificar la consistencia de los datos: SKU únicos, saldos, lotes, capacidad de ubicaciones, despachos y comprobantes.'],['Funcionalidades reales, simuladas y pendientes','Reales (funcionan con los datos de este navegador): inventario y trazabilidad, ABC, lotes y FEFO, solicitudes con entregas, bodega y traslados, órdenes de transporte, mapa de ubicaciones, exportación e importación Excel, manual y autopruebas. Simuladas: todos los datos de demostración, las posiciones de vehículos, el avance, la llegada estimada y los usuarios y perfiles. Pendientes de integración: servidor y base de datos compartida, autenticación const FAQ=[['¿Se pierden los datos al cerrar el navegador?','No, se guardan en este navegador. Se pierden si borras los datos del sitio o cambias de navegador o equipo. Exporta a Excel como respaldo.'],['¿Por qué no puedo hacer una acción?','Tu perfil, elegido en el encabezado, no tiene ese permiso. Cambia a un perfil que sí lo tenga.'],['¿El mapa muestra GPS en vivo?','No. No hay un GPS real conectado; las posiciones y llegadas son simuladas.'],['¿Pueden trabajar varias personas a la vez?','No. Cada navegador tiene sus propios datos porque no hay servidor.']];
const SOL=[['El mapa no carga','Revisa tu conexión a internet. Leaflet y los mosaicos de OpenStreetMap se descargan en línea.'],['No puedo exportar o importar Excel','La librería de Excel se descarga en línea. Recarga la página con conexión.'],['El Excel importado rechaza filas','Lee el mensaje: indica la fila y el motivo, por ejemplo SKU repetido, costo vacío o máximo menor que mínimo.'],['Una orden no aparece en el mapa','Faltan coordenadas del origen, las paradas o el destino. Regístralas en GPS con el nombre exacto.'],['Quiero empezar de cero','En el Dashboard pulsa Restablecer datos de demostración.']];
function manHtml(s){const all=[...s,...FAQ.map(x=>['Pregunta: '+x[0],x[1]]),...SOL.map(x=>['Problema: '+x[0],x[1]])],n=TUT.filter((x,i)=>db.tut&&db.tut[i]).length;
return `<div class="card noprint"><div class="f"><div><label>Buscar en el manual</label><input id="mq2" type="search" oninput="manFilt()"></div><button class="btn" onclick="window.print()">Imprimir o guardar como PDF</button><button class="ib" onclick="printGuia()">Imprimir guía rápida</button></div></div>
<div class="card" id="qg" style="margin-top:12px"><h3>Guía rápida</h3><ol><li>Inventario: crea el producto y registra el ingreso con lote, vencimiento y ubicación.</li><li>ABC: revisa las clases A, B y C y ajusta los límites.</li><li>FEFO: pide la salida; se sugieren los lotes que vencen antes.</li><li>Solicitudes: crea, aprueba (reserva) y entrega (descuenta stock).</li><li>Bodega: toca una ubicación o traslada lotes respetando capacidad y bloqueos.</li><li>TMS: crea la orden con las entregas de bodega y avánzala hasta el comprobante.</li><li>GPS: mira el mapa; las posiciones son simuladas.</li><li>Reportes: exporta a Excel como respaldo.</li></ol><p>Los datos son de demostración y se guardan solo en este navegador.</p></div>
<div class="card" style="margin:12px 0"><h3>Tutorial interactivo (${n} de ${TUT.length})</h3>${TUT.map((t,i)=>`<p><label style="display:inline;color:var(--tx)"><input type="checkbox" style="width:auto" ${db.tut&&db.tut[i]?'checked':''} onchange="tutT(${i},this.checked)"> <b>${i+1}. ${t[0]}.</b></label> ${t[2]} <button class="ib noprint" onclick="go('${t[1]}')">Ir</button></p>`).join('')}</div>
<div class="card noprint" style="margin-bottom:12px"><h3>Índice</h3>${all.map((x,i)=>`<a href="#" onclick="manOpen(${i});return false" style="display:inline-block;margin:2px 10px 2px 0;color:var(--pr)">${x[0]}</a>`).join('')}</div>
<div id="mdet">${all.map((x,i)=>`<details id="m${i}"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div>`}
function manFilt(){const q=$('#mq2').value.toLowerCase();document.querySelectorAll('#mdet details').forEach(d=>d.style.display=d.textContent.toLowerCase().includes(q)?'':'none')}
function manOpen(i){const d=$('#m'+i);if(d){d.style.display='';d.open=true;d.scrollIntoView({behavior:'smooth'})}}
function tutT(i,c){db.tut=db.tut||{};db.tut[i]=c;save();render()}
function printGuia(){document.body.classList.add('pg');window.print()}
addEventListener('beforeprint',()=>document.querySelectorAll('#v details').forEach(d=>d.open=true));addEventListener('afterprint',()=>document.body.classList.remove('pg'));

render();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})</script>
</body>
