var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }

async function cargarEstado(){const r=await api('GET','/api/state');if(!r.ok)throw new Error('estado');const d=r.j.data;db=d&&d.prods?d:vacio();VER=r.j.version;norm();db.role=SES.user.role;D=null;PEND=false;render()}
async function sondeo(){if(!SES||PEND||SAVING||document.hidden)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$('#v').contains(a))return;
 try{const r=await api('GET','/api/state?since='+VER);if(r.s===401){SES=null;mostrarLogin('Tu sesión terminó. Ingresa de nuevo.');return}if(r.ok&&!r.j.unchanged&&!PEND)await cargarEstado()}catch(e){}}
function bloqueo(on){document.querySelectorAll('.wrap,#sb').forEach(x=>x.inert=on)}
function mostrarLogin(m,setup){clearInterval(POLL);$('#lg').style.display='flex';bloqueo(true);$('#who').textContent='';$('#out').style.display='none';estado('');$('#fl').style.display=setup?'none':'';$('#fs').style.display=setup?'':'none';$('#lgs').textContent=setup?'Configuración inicial':'Ingresa con tu correo y contraseña.';$('#lk').value='';$('#le').textContent=m||'';setTimeout(()=>$(setup?'#se':'#lc').focus(),0)}
async function iniciar(){try{const r=await api('GET','/api/me');if(r.ok){SES=r.j;USER=SES.user.name;await cargarEstado();$('#lg').style.display='none';bloqueo(false);$('#who').textContent=SES.user.name+' · '+SES.user.role+' · '+SES.empresa;$('#out').style.display='';clearInterval(POLL);POLL=setInterval(sondeo,15000);return}
 const s=await api('GET','/api/setup');mostrarLogin('',s.j.necesaria)}catch(e){mostrarLogin('No se pudo conectar con el servidor.')}}
async function entrar(e){e.preventDefault();const le=$('#le');le.textContent='';let r;try{r=await api('POST','/api/auth/login',{correo:$('#lc').value.trim(),clave:$('#lk').value})}catch(x){le.textContent='No se pudo conectar con el servidor.';return}
 $('#lk').value='';if(!r.ok){le.textContent=r.j.error||'No se pudo ingresar.';return}await iniciar()}
async function configurar(e){e.preventDefault();const le=$('#le');le.textContent='';let r;try{r=await api('POST','/api/setup',{empresa:$('#se').value,nombre:$('#sn').value,correo:$('#sc').value.trim(),clave:$('#sk').value})}catch(x){le.textContent='No se pudo conectar con el servidor.';return}
 $('#sk').value='';if(!r.ok){le.textContent=r.j.error||'No se pudo crear la cuenta.';return}await iniciar()}
async function salir(){if(PEND&&SES){clearTimeout(TMR);await guardar()}try{await api('POST','/api/auth/logout')}catch(e){}SES=null;db=vacio();norm();USER='';mostrarLogin('')}
addEventListener('beforeunload',e=>{if(PEND||SAVING){e.preventDefault();e.returnValue=''}});
async function cargarUsuarios(){const g=$('#ug');if(!g)return;if(db.role!=='Administrador'){g.innerHTML='<p>Solo el Administrador gestiona los usuarios.</p>';return}
 let r;try{r=await api('GET','/api/users')}catch(e){g.innerHTML='<p>No se pudo conectar con el servidor.</p>';return}if(!r.ok){g.innerHTML='<p>No se pudieron cargar los usuarios.</p>';return}
 g.innerHTML=T(['Nombre','Correo','Perfil','Estado',''],r.j.users.map(u=>[esc(u.nombre),esc(u.correo),'<select aria-label="Perfil de '+esc(u.nombre)+'" onchange="cambiarUsr('+u.id+',{perfil:this.value})">'+ROLES.map(x=>'<option'+(x===u.perfil?' selected':'')+'>'+x+'</option>').join('')+'</select>',bd(u.activo?'Activo':'Inactivo',u.activo?'ok':'er'),'<button class="ib" onclick="cambiarUsr('+u.id+',{activo:'+(!u.activo)+'})">'+(u.activo?'Desactivar':'Activar')+'</button> <button class="ib" onclick="claveUsr('+u.id+')">Nueva contraseña</button>']))
 +'<h4 style="margin:14px 0 6px">Agregar usuario</h4><form class="f" onsubmit="crearUsr(event)"><div><label>Nombre</label><input id="un" required maxlength="80"></div><div><label>Correo</label><input id="uc" type="email" required></div><div><label>Perfil</label><select id="up">'+ROLES.map(x=>'<option>'+x+'</option>').join('')+'</select></div><div><label>Contraseña temporal (mínimo 10)</label><input id="uk" minlength="10" required autocomplete="off"></div><button class="btn">Crear usuario</button></form>'}
async function cambiarUsr(id,b){const r=await api('PATCH','/api/users/'+id,b);msg(r.ok?'Usuario actualizado.':(r.j.error||'No se pudo actualizar.'),r.ok);cargarUsuarios()}
function claveUsr(id){const k=prompt('Nueva contraseña (mínimo 10 caracteres)');if(k)cambiarUsr(id,{clave:k})}
async function crearUsr(e){e.preventDefault();const r=await api('POST','/api/users',{nombre:$('#un').value,correo:$('#uc').value.trim(),perfil:$('#up').value,clave:$('#uk').value});msg(r.ok?'Usuario creado.':(r.j.error||'No se pudo crear.'),r.ok);if(r.ok)cargarUsuarios()}


// Etiquetas con código QR (lotes y ubicaciones)
let EF={sku:'',saldo:true};
const des=x=>String(x).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'),asc=x=>des(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').replace(/\|/g,'-');
function qrSvg(t){const q=window.qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}
function etqLoteHtml(l){const p=db.prods.find(x=>x.sku===l.sku)||{n:l.sku,c:'',u:''},lc=locs().find(x=>x.id===l.u),sc=lc&&db.secs.find(s=>s.c===lc.c),q=['WMS','L',asc(l.sku),asc(l.l),asc(l.u),l.v].join('|');
return '<div class="etq"><div class="eq">'+qrSvg(q)+'</div><div class="et"><div class="ep">'+p.n+'</div><div class="es">'+l.sku+(p.c?' · '+p.c:'')+'</div><div class="el">LOTE <b>'+l.l+'</b></div><div class="eu">UBICACIÓN <b>'+l.u+'</b>'+(sc?'<div class="es">'+sc.n+'</div>':'')+'</div><div class="ev">Vence: '+l.v+' · Recibido: '+(l.r||'—')+'</div><div class="ec">Cantidad: '+l.q+' '+p.u+'</div></div></div>'}
function etqUbicHtml(x){const sc=db.secs.find(s=>s.c===x.c);return '<div class="etq"><div class="eq">'+qrSvg('WMS|U|'+asc(x.id))+'</div><div class="et"><div class="ev">UBICACIÓN</div><div class="eub">'+x.id+'</div><div class="es">'+(sc?sc.n:x.c)+'</div><div class="ev">'+x.t+'</div></div></div>'}
function imprimirEtq(h,f){if(!h.length)return msg('No hay etiquetas para imprimir.');let c=$('#etq');if(!c){c=document.createElement('div');c.id='etq';document.body.appendChild(c)}
 c.className=f==='a4'?'f2':'f1';c.innerHTML=h.join('');let st=$('#pgz');if(!st){st=document.createElement('style');st.id='pgz';document.head.appendChild(st)}
 st.textContent=f==='a4'?'@page{size:A4;margin:8mm}':'@page{size:100mm 70mm;margin:0}';document.body.classList.add('pe');setTimeout(()=>window.print(),60)}
addEventListener('afterprint',()=>{document.body.classList.remove('pe');const c=$('#etq');if(c)c.innerHTML=''});
const efm=()=>($('#ef')||{}).value||'etq';
function etqLote(i){const l=db.lots[i];if(l)imprimirEtq([etqLoteHtml(l)],efm())}
function etqSel(){const h=[...document.querySelectorAll('.eck:checked')].map(c=>db.lots[+c.dataset.i]).filter(Boolean).map(etqLoteHtml);if(!h.length)return msg('Marca al menos un lote.');imprimirEtq(h,efm())}
function etqMarcar(v){document.querySelectorAll('.eck').forEach(c=>c.checked=v)}
function etqUbic(){const s=$('#es').value;imprimirEtq(locs().filter(x=>!s||x.c===s).map(etqUbicHtml),efm())}

iniciar();
